schema: track.v1
track_key: coo
title: Chief Operating Officer Executive Track
weeks: 16
source: seed/coo
session_template:
  - {kind: framework, weekday: 0, minutes: 90}
  - {kind: case_prep, weekday: 1, minutes: 60}
  - {kind: case_class, weekday: 2, minutes: 120}
  - {kind: lab, weekday: 4, minutes: 90}
  - {kind: lab, weekday: 5, minutes: 90}
  - {kind: exam, weekday: 6, minutes: 60}
rubric:
  version: rubric.v1
  criteria: [thesis, evidence, analysis, counterargument, recommendation]
  weights: {memos: 60, defenses: 20, capstone: 20}
weeks_detail:
  - week: 1
    theme: "Operating model diagnosis"
    case: "The plant that could not see its own queue"
    readings: ["Goldratt, The Goal, ch. 1-3", "Skinner, Manufacturing: the formidable competitive weapon"]
  - week: 2
    theme: "Throughput and the constraint"
    case: "Bottleneck triage at a port terminal"
    readings: ["Goldratt, The Goal, ch. 4-9"]
  - week: 3
    theme: "Capacity planning under uncertainty"
    case: "Seasonal demand at a cold-chain operator"
    readings: ["Hopp & Spearman, Factory Physics, ch. 7"]
  - week: 4
    theme: "Service operations and queueing"
    case: "Emergency department flow"
    readings: ["Cachon & Terwiesch, Matching Supply with Demand, ch. 8"]
  - week: 5
    theme: "Inventory and working capital"
    case: "The distributor holding six months of stock"
    readings: ["Silver, Pyke & Thomas, Inventory and Production Management, ch. 4"]
  - week: 6
    theme: "Quality systems and cost of failure"
    case: "A recall that started in one shift"
    readings: ["Deming, Out of the Crisis, ch. 3"]
  - week: 7
    theme: "Lean without theatre"
    case: "Kaizen that never reached the floor"
    readings: ["Womack & Jones, Lean Thinking, ch. 2"]
  - week: 8
    theme: "Supplier strategy and risk"
    case: "Single-source exposure in a components crisis"
    readings: ["Sheffi, The Resilient Enterprise, ch. 5"]
  - week: 9
    theme: "Operating cadence and decision rights"
    case: "The weekly review nobody used"
    readings: ["Lencioni, Death by Meeting, ch. 4"]
  - week: 10
    theme: "Metrics that mislead"
    case: "A utilisation target that starved delivery"
    readings: ["Kaplan & Norton, The Balanced Scorecard, ch. 2"]
  - week: 11
    theme: "Automation economics"
    case: "Robotics priced against a labour model that moved"
    readings: ["Brynjolfsson & McAfee, The Second Machine Age, ch. 6"]
  - week: 12
    theme: "Cost-to-serve"
    case: "The customer tier that lost money quietly"
    readings: ["Kaplan & Cooper, Cost and Effect, ch. 3"]
  - week: 13
    theme: "Organisation design for flow"
    case: "Two plants, one planning function"
    readings: ["Galbraith, Designing Organizations, ch. 5"]
  - week: 14
    theme: "Transformation sequencing"
    case: "A turnaround with eighteen months of runway"
    readings: ["Kotter, Leading Change, ch. 5"]
  - week: 15
    theme: "Operating risk and resilience"
    case: "The flood that took the only line"
    readings: ["Sheffi, The Resilient Enterprise, ch. 9"]
  - week: 16
    theme: "Capstone defence: the operating plan"
    case: "Board defence of a 24-month operating plan"
    readings: ["Review the term's memos against your own plan"]
