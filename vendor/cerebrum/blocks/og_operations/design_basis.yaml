# Oil & gas operations reasoning layer — operating basis.
#
# Source of truth: the domain encoding sheet for Oil & Gas Operations. NO
# INTERVIEW HAS RUN. Every `value` below is null on purpose and stays null
# until the interview fills it; see KNOWN_GAPS.md.
#
# A null value is legal. A MISSING QUALIFIER IS NOT: the loader refuses any
# figure that does not carry every key in MANDATORY_QUALIFIERS, at load time,
# naming the figure and the keys it lacks. A half-qualified figure is how a
# trip setpoint ends up answering a design-pressure question, or an alarm
# figure ends up quoted as if it were the trip.
#
# envelope_tier is part of the identity of every pressure figure, not a label
# on it:
#   normal   steady operating condition
#   alarm    operator-actionable warning, before a trip
#   trip     automatic protective action fires
#   SOL      safe operating limit — the ceiling the trip protects
#   design   the vessel/line design basis (MAWP, design pressure)
# Nothing carries between them, and nothing carries between pressure_kind
# (design | mawp | operating) and envelope_tier — they are two different axes
# of the same figure. See reasoning.py.
source: "domain encoding sheet, Oil & Gas Operations"
scope: "asset- and tag-specific — never carry a figure to another facility, unit or sister asset"
