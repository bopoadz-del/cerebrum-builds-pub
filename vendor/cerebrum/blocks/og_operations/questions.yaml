questions:
  - id: '1.1'
    section: '1'
    gate: true
    text: >-
      Your agreed deferment cost figure per situation — full facility shutdown, single
      train/module down, single well shut in, compression down, export/offtake unavailable,
      rate reduction per %, flaring instead of export, planned outage per hour, unplanned
      outage per hour — with source, owner, and revision date against price.
  - id: '1.2'
    section: '1'
    gate: true
    text: >-
      Your unplanned vs planned ratio on your assets — the multiple as experienced.
  - id: '1.3'
    section: '1'
    gate: true
    text: >-
      Your step costs — the points where an outage stops being linear on your asset
      (contractual delivery failure, tank tops, well restart, flaring limits, regulatory
      notification).
  - id: '1.4'
    section: '1'
    gate: true
    text: >-
      Your restart cost independent of outage — time to stable, off-spec product, chemical
      consumption, flaring.
  - id: '2.1'
    section: '2'
    gate: true
    text: >-
      Your per-item cost — fuel gas/self-consumption, power import, corrosion inhibitor,
      scale inhibitor, demulsifier, H₂S scavenger, methanol/MEG, amine make-up, catalyst
      per charge, produced water handling, chemical disposal/waste, flare gas value and
      carbon cost.
  - id: '2.2'
    section: '2'
    gate: true
    text: >-
      Which of your consumables have a rate tied to production vs fixed.
  - id: '2.3'
    section: '2'
    gate: true
    text: >-
      Your long lead consumables that constrain operations if stock runs low.
  - id: '3.1'
    section: '3'
    gate: true
    text: >-
      Your turnaround interval per unit and what governs each on your asset — regulatory,
