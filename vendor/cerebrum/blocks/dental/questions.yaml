  - id: '15.6'
    section: '15'
    gate: true
    text: >-
      Which figures are equipment-specific on your practice and never carried between
      machines or systems.
  - id: '16.1'
    section: '16'
    gate: false
    text: >-
      Where a cartridge count confusion has occurred in your practice — right count, wrong
