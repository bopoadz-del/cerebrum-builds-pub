    text: >-
      Your station register — station name/ID, number of pumps (duty/standby/assist), pump
      make/model/impeller diameter/trim, rated flow and head at duty point, BEP flow, motor
      rated power/voltage/FLC, VFD fitted and speed range, static lift min/max, rising main
      diameter/length/material, wet well volume (gross and working), design peak inflow —
      with the source of each.
  - id: '1.2'
    section: '1'
    gate: true
    text: >-
      Which of your pumps are oversized for present demand, and how you run them.
  - id: '1.3'
    section: '1'
    gate: true
    text: >-
      Which of your pumps are duty-assist vs duty-standby, and how each is sequenced.
  - id: '2.1'
    section: '2'
    gate: true
    text: >-
      Your specific energy consumption per station (kWh/m³), energy at BEP vs your actual
      operating point, electricity tariff peak and off-peak, demand/capacity charge,
      standby generator running cost, power factor penalty threshold — with source.
  - id: '2.2'
    section: '2'
    gate: true
    text: >-
      Your target specific energy per m³, and the actual — with the gap.
  - id: '2.3'
    section: '2'
    gate: true
    text: >-
      Where pumping is shifted to off-peak on your network, and what governs the window.
  - id: '2.4'
    section: '2'
    gate: true
    covers: [efficiency]
    text: >-
      What a 1% efficiency loss costs annually at each of your stations.
  - id: '3.1'
    section: '3'
    gate: true
    text: >-
      Your cost and lead time per item — pump overhaul, impeller replacement, mechanical
