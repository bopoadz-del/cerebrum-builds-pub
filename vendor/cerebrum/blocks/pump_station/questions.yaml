  - id: '3.3'
    section: '3'
    gate: true
    text: >-
      Your MTBF per pump type and the dominant failure mode on your estate.
  - id: '3.4'
    section: '3'
    gate: true
    text: >-
      Your spares holding, and your longest lead item that would keep a station down.
  - id: '4.1'
    section: '4'
    gate: true
    covers: [npsh_available, npsha]
    text: >-
