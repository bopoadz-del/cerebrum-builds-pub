questions:
  - id: 'A.1'
    section: 'A'
    gate: true
    text: >-
      Quay / berth structural limits — your quay wall design load (kN/m²), deck loading
      limits, any areas with reduced capacity, and the design dossier or as-built that
      holds them.
  - id: 'A.2'
    section: 'A'
    gate: true
    text: >-
      Declared depths and tidal windows — your berth depths, chart datum basis, latest
