  - id: 'G.2'
    section: 'G'
    gate: true
    text: >-
      Who may accept a figure for use — by role, not name.
  - id: 'G.3'
    section: 'G'
    gate: true
    text: >-
      Figures requiring two independent sources before use on your terminal.
  - id: 'H.1'
    section: 'H'
    gate: true
    text: >-
      Your rule-and-figure list against the regulation, standard, or manual that anchors
