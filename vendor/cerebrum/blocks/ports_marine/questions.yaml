  - id: 'E.2'
    section: 'E'
    gate: false
    text: >-
      Any case where a decimal, comma, or thousands separator caused trouble.
  - id: 'F.1'
    section: 'F'
    gate: false
    text: >-
      A time a figure came from the wrong source or the wrong revision.
  - id: 'F.2'
    section: 'F'
    gate: false
    text: >-
