  - id: 'F.3'
    section: 'F'
    gate: false
    text: >-
      A time someone assumed a figure because it "looked normal".
  - id: 'F.4'
    section: 'F'
    gate: false
    text: >-
      What a junior marine engineer most commonly gets wrong in their first year on your
