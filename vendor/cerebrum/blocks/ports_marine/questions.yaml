      depth.
  - id: 'A.3'
    section: 'A'
    gate: true
    covers: [wheel_load]
    text: >-
      Crane rail and wheel loads — your crane rail loading limits (kN/m), wheel load
      limits, and the crane/quay design documents that state them.
  - id: 'A.4'
    section: 'A'
    gate: true
    covers: [fender_energy]
    text: >-
      Bollard and fender capacities — your bollard safe working loads (tonnes), fender
      energy absorption and reaction limits, and the certification for each.
  - id: 'A.5'
    section: 'A'
    gate: true
    covers: [stack_height]
    text: >-
      Container stacking and wind limits — your stack height limits by tier and by area,
      wind speed thresholds that trigger action, and where these are written.
  - id: 'A.6'
    section: 'A'
    gate: true
    text: >-
      Mooring analysis limits — your allowable mooring line loads, environmental limits for
      mooring, and any berth-specific restrictions.
  - id: 'A.7'
    section: 'A'
    gate: true
    text: >-
      Dredging tolerances — your permitted dredge depth, tolerance, and the regulatory or
      design basis.
  - id: 'A.8'
    section: 'A'
    gate: true
    text: >-
      Any other figure on your terminal where a wrong value causes structural failure,
      grounding, mooring failure, or toppling — list them with their authoritative source.
  - id: 'B.1'
    section: 'B'
    gate: false
    text: >-
      Your list. Typical candidates: berth productivity rates, expected turnaround times,
      seasonal congestion, planning-level vessel sizes. Confirm which you accept as
      estimates, and the disclosure wording.
  - id: 'C.1'
    section: 'C'
    gate: true
    text: >-
      Your refusal list. Likely candidates: is it safe to berth this vessel, can this crane
      lift this load, is this berth available, is the depth adequate today, can we stack
      higher. State each and what the system should say instead.
  - id: 'D.1'
    section: 'D'
    gate: true
    text: >-
      Your ranking, highest first — flag / port state regulation, classification society,
      terminal design dossier, as-built drawings, operating manual, berth-specific
      procedure, harbour master instruction, shift instruction. Your order.
  - id: 'D.2'
    section: 'D'
    gate: true
    text: >-
      Revision currency — how someone on your terminal knows a document is the current
      revision, and what happens when a superseded one is used.
  - id: 'D.3'
    section: 'D'
    gate: true
    text: >-
      Figures where a local or project-specific value overrides the standard on your
      terminal — list them.
  - id: 'D.4'
    section: 'D'
    gate: true
    text: >-
      Figures that must never be applied outside their specific context — berth, asset,
      vessel class, product — on your terminal.
  - id: 'E.1'
    section: 'E'
    gate: false
    text: >-
      Your unit-confusion history — tonnes vs kN vs kips, metres vs feet, chart datum vs
