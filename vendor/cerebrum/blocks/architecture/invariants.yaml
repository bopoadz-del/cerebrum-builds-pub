invariants:

- id: INV-ARC-AUTH-CODE
  kind: authority
  applies_to: {quantity: any, claim_class: code_requirement}
  hook: H1
  governing_class: building_code
  fallback_class: planning_consent
  demote: [design_guide, previous_project, consultant_email]
  severity: refuse
  evidence: {sheet: "§7.1"}
  message: "code requirement governed by the code — a guide or previous project is not the code"
  measurement: >-
    Probe every declared quantity x20 citing design_guide, previous_project,
    consultant_email as the source. Before: n answers accepted it as proof. After:
    0 accepted, and n refusals naming building_code as the class that governs.
    Over-refusal check: the same probe citing building_code must pass.

- id: INV-ARC-AREA-BASIS
  kind: qualifier
  applies_to: {quantity: floor_area}
  requires: [area_basis]
  severity: refuse
  hook: H3
  evidence: {sheet: "§4.1, §7.3.1"}
  message: "floor area missing {missing} — same building, several correct answers 20-30% apart"
  measurement: >-
    Probe floor_area x20 with area_basis absent from the figure. Before: n answers
    stated the figure with nothing to act on. After: 0 such answers, and n refusals
    naming every missing field. Over-refusal check: the same probe WITH area_basis
    present must pass.

- id: INV-ARC-PLOT-RATIO
  kind: qualifier
  applies_to: {quantity: [plot_ratio, site_coverage]}
  requires: [area_basis, code_edition]
  severity: refuse
  hook: H3
  evidence: {sheet: "§4.2"}
  message: "plot ratio missing {missing} — inclusions and exclusions vary by jurisdiction"
  measurement: >-
    Probe plot_ratio, site_coverage x20 with area_basis, code_edition absent from
    the figure. Before: n answers stated the figure with nothing to act on. After:
    0 such answers, and n refusals naming every missing field. Over-refusal check:
    the same probe WITH area_basis, code_edition present must pass.

