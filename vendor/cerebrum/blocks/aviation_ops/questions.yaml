  - id: '11.4'
    section: '11'
    gate: true
    text: >-
      Which figures are station-specific on your network and never applied network-wide.
  - id: '11.5'
    section: '11'
    gate: true
    text: >-
      Which figures are registration-specific, not just type-specific — weight variants,
