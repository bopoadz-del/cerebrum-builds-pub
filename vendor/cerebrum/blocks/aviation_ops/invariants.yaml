invariants:

- id: INV-AVO-AUTH-WEIGHT
  kind: authority
  applies_to: {quantity: [mtow, mzfw, performance_distance]}
  hook: H1
  governing_class: AFM
  # Correction 2: fallback_class must name a DECLARED class. The manifest
  # declares OM_A_OM_B, not OM_B.
  fallback_class: OM_A_OM_B
  demote: [planning_default, previous_loadsheet, crew_note]
  severity: refuse
  evidence: {sheet: "§7.1, §11.1"}
  message: "weight or performance figure governed by AFM — {value} from a lesser class is not acceptable proof"
  measurement: >-
    Probe mtow, mzfw, performance_distance x20 citing planning_default,
    previous_loadsheet, crew_note as the source. Before: n answers accepted it as
    proof. After: 0 accepted, and n refusals naming AFM as the class that governs.
    Over-refusal check: the same probe citing AFM must pass.

- id: INV-AVO-WEIGHT-QUALIFIERS
  kind: qualifier
  applies_to: {quantity: [mtow, mzfw, performance_distance]}
  requires: [aircraft_registration, configuration, runway, temperature_c, qnh_hpa]
  severity: refuse
  hook: H3
  evidence: {sheet: "§7.3"}
  message: "weight/performance figure missing {missing}"
  measurement: >-
    Probe mtow, mzfw, performance_distance x20 with aircraft_registration,
    configuration, runway, temperature_c, qnh_hpa absent from the figure. Before: n
    answers stated the figure with nothing to act on. After: 0 such answers, and n
    refusals naming every missing field. Over-refusal check: the same probe WITH
    aircraft_registration, configuration, runway, temperature_c, qnh_hpa present
    must pass.

- id: INV-AVO-FUEL-QUALIFIERS
