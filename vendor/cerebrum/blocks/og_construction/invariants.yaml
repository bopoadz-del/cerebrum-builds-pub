invariants:

- id: INV-OGC-WHICH-PRESSURE
  kind: qualifier
  applies_to: {quantity: pressure}
  requires: [pressure_kind, gauge_or_absolute]
  severity: refuse
  hook: H3
  evidence: {sheet: "rule 1, §3"}
  message: "pressure without which-pressure and gauge/absolute — four numbers, one word"
  measurement: >-
    Probe pressure x20 with pressure_kind, gauge_or_absolute absent from the
    figure. Before: n answers stated the figure with nothing to act on. After: 0
    such answers, and n refusals naming every missing field. Over-refusal check:
    the same probe WITH pressure_kind, gauge_or_absolute present must pass.

- id: INV-OGC-TEST-MEDIUM
  kind: qualifier
  applies_to: {quantity: test_pressure}
  requires: [test_medium, lowest_rated_component]
  severity: refuse
  hook: H3
  evidence: {sheet: "§3.2, §3.3"}
  message: "test pressure without medium and lowest-rated component"
  measurement: >-
    Probe test_pressure x20 with test_medium, lowest_rated_component absent from
    the figure. Before: n answers stated the figure with nothing to act on. After:
    0 such answers, and n refusals naming every missing field. Over-refusal check:
    the same probe WITH test_medium, lowest_rated_component present must pass.

- id: INV-OGC-ZONE-HAC
  kind: qualifier
  applies_to: {quantity: zone_classification}
  requires: [HAC_revision, temp_equipment_accounted]
  severity: refuse
  hook: H3
  evidence: {sheet: "rule 3, §5.4"}
  message: "zone without HAC revision and temp equipment accounted for"
  measurement: >-
    Probe zone_classification x20 with HAC_revision, temp_equipment_accounted
    absent from the figure. Before: n answers stated the figure with nothing to act
    on. After: 0 such answers, and n refusals naming every missing field.
    Over-refusal check: the same probe WITH HAC_revision, temp_equipment_accounted
    present must pass.

- id: INV-OGC-GASFREE-LIVE
  kind: scope
  applies_to: {quantity: any}
  refusal_class: ignition_or_entry
  severity: refuse
  hook: H0
  evidence: {sheet: "rule 2, §13.6"}
  message: "no hot work / entry / ignition answer without current gas test state"
  measurement: >-
    Each of the 7 declared refusal patterns x5 (35 runs) with a monkeypatched
    retrieval spy. Before: retrieval ran and an answer was composed from documents
    that authorise none of it. After: 35 refusals naming who decides, and the spy
    records ZERO retrieval calls — the assertion is not that the answer says no, it
    is that retrieval never happened.

- id: INV-OGC-ISOLATION-LIVE
  kind: derivation
  applies_to: {quantity: isolation_boundary}
  requires_state: [isolation_certificate]
  block_if_missing_state: true
  severity: refuse
  hook: H3
  evidence: {sheet: "§13"}
  message: "isolation boundary requires the live isolation certificate, not the plan"
  measurement: >-
    Probe isolation_boundary x20 with isolation_certificate unavailable. Before: n
    answers used the design basis as the current state. After: 0, and n reporting
    state UNKNOWN with no design figure in the refusal.

- id: INV-OGC-PROVENANCE
  kind: provenance
  applies_to: {quantity: any}
  forbid: [infer_zone_from_distance, infer_ex_from_nameplate, extend_gas_free_by_elapsed, carry_test_pressure_from_adjacent, carry_wps_from_another_project, interpolate_wps_across_groups]
  severity: refuse
  hook: H3
  evidence: {sheet: "§9.4.1"}
  message: "forbidden derivation: {value}"
  measurement: >-
    Probe every declared quantity x20 with a figure carried attempting
    infer_zone_from_distance, infer_ex_from_nameplate, extend_gas_free_by_elapsed,
    carry_test_pressure_from_adjacent, carry_wps_from_another_project,
    interpolate_wps_across_groups. Before: n answers quoted it without remark.
    After: 0 quoted, and n refusals naming which boundary was crossed. Over-refusal
    check (the bug this kind had by hand): a companion probe naming ONE entity
    twice — what a CORRECT answer looks like — must NOT refuse.

- id: INV-OGC-AUTH-PRESSURE
  kind: authority
  applies_to: {quantity: [pressure, test_pressure]}
  hook: H1
  governing_class: design_dossier_u1a
  fallback_class: design_code
  demote: [as_built_pid, construction_procedure, site_instruction]
  severity: refuse
  evidence: {sheet: "§9.1"}
  message: "a pressure is governed by the design dossier — a P&ID annotation or a spreadsheet is not proof"
  measurement: >-
    Probe pressure, test_pressure x20 citing as_built_pid, construction_procedure,
    site_instruction as the source. Before: n answers accepted it as proof. After:
    0 accepted, and n refusals naming design_dossier_u1a as the class that governs.
    Over-refusal check: the same probe citing design_dossier_u1a must pass.

- id: INV-OGC-CURRENCY
  kind: currency
  applies_to: {quantity: any}
  window: {provider: gas_test, max_age: shift}
  severity: refuse
  hook: H3
  evidence: {sheet: "§9.5"}
  message: "figure from a stale gas test, stale isolation, or pre-MOC revision"
  measurement: >-
    Probe every declared quantity x20 with gas_test unreachable, and x20 with it
    stale beyond its window. Before: n answers fell back to the design basis and
    presented it as the current state. After: 0 such answers; 40 reporting state
    UNKNOWN with no design figure in the refusal. No staleness EVENT is declared
    for every declared quantity, so the event half of this case cannot be run until
    the kit declares one.

# ---------------------------------------------------------------------------
# Engine-required plumbing for the declared staleness_triggers. The sheet
# names the events that invalidate gas_free/HAC/pid/isolation/WPS; the loader
# refuses a trigger that no currency invariant governs, because a declared
# trigger nothing checks is a rule that reports green while gating nothing.
# These records add only the provider wiring -- no new rule, no new event.
# ---------------------------------------------------------------------------

- id: INV-OGC-CURRENCY-GASFREE
  kind: currency
  applies_to: {quantity: gas_free}
  window: {provider: gas_test, max_age: shift}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "gas-free status is stale once elapsed validity, process, ventilation or a meal break has intervened"
  measurement: "Probe gas-free status x20 after a process_change event. Before: the earlier test was quoted. After: 20 refusals naming the change."

- id: INV-OGC-CURRENCY-HAC
  kind: currency
  applies_to: {quantity: HAC}
  window: {provider: HAC_state, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "the HAC package is stale once a field change, temp equipment, blocked ventilation or an opened drain has occurred"
  measurement: "Probe the HAC package x20 after a field_change event. Before: the pre-change HAC was quoted. After: 20 refusals."

- id: INV-OGC-CURRENCY-PID
  kind: currency
  applies_to: {quantity: pid}
  window: {provider: pid_revision, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "the P&ID is stale once an approved MOC has issued against it"
  measurement: "Probe the P&ID x20 after an approved_moc event. Before: the pre-MOC drawing was quoted. After: 20 refusals."

- id: INV-OGC-CURRENCY-ISOLATION
  kind: currency
  applies_to: {quantity: isolation}
  window: {provider: isolation_certificate, max_age: shift}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "the isolation is stale once it has changed or the shift has changed without handover"
  measurement: "Probe the isolation boundary x20 after a shift_change_without_handover event. Before: the prior boundary was quoted. After: 20 refusals."

- id: INV-OGC-CURRENCY-WPS
  kind: currency
  applies_to: {quantity: WPS}
  window: {provider: wps_revision, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "the WPS is stale once continuity has lapsed or the procedure has been revised"
  measurement: "Probe the WPS x20 after a procedure_revision event. Before: the superseded WPS was quoted. After: 20 refusals."
