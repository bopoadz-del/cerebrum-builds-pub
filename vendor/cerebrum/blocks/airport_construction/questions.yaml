      operator's stated figure.
  - id: '2.1'
    section: '2'
    gate: true
    text: >-
      Your rates per item — rigid pavement (PQC), flexible pavement, grooving, marking new
      and removal, AGL inset light, AGL elevated light, primary cable, CCR, ducting and
      pits, airfield drainage, fuel hydrant pit, blast pad/fence, frangible
      mounting/coupling, temporary threshold marking, temporary lighting, FOD
      sweeping/inspection, rapid-set premium — as you price them on your projects.
  - id: '2.2'
    section: '2'
    gate: true
    text: >-
      Which items must be rapid-set or fast-cure on your works because of the window, and
      the premium.
  - id: '2.3'
    section: '2'
    gate: true
    text: >-
      Your airside materials with long lead times that govern your programme.
  - id: '3.1'
    section: '3'
    gate: true
    covers: [acr, pcn]
