invariants:

- id: INV-APC-AUTH-OLS
  kind: authority
  applies_to: {quantity: [ols_penetration_height, ils_critical_area, declared_distance]}
  hook: H1
  governing_class: icao_annex_14
  fallback_class: national_aviation_reg
  demote: [aerodrome_manual, design_drawings, method_statement]
  severity: refuse
  evidence: {sheet: "§5.1, §9.1"}
  message: "OLS/declared-distance figure governed by ICAO Annex 14 — a lesser source is not acceptable proof"
  measurement: >-
    Probe ols_penetration_height, ils_critical_area, declared_distance x20 citing
    aerodrome_manual, design_drawings, method_statement as the source. Before: n
    answers accepted it as proof. After: 0 accepted, and n refusals naming
    icao_annex_14 as the class that governs. Over-refusal check: the same probe
    citing icao_annex_14 must pass.

- id: INV-APC-OLS-QUALIFIERS
  kind: qualifier
  applies_to: {quantity: ols_penetration_height}
  requires: [surface_name, aerodrome_reference_code, reference_point, datum_m_or_ft, amsl_basis]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.3"}
  message: "OLS figure missing {missing}"
  measurement: >-
    Probe ols_penetration_height x20 with surface_name, aerodrome_reference_code,
    reference_point, datum_m_or_ft, amsl_basis absent from the figure. Before: n
    answers stated the figure with nothing to act on. After: 0 such answers, and n
    refusals naming every missing field. Over-refusal check: the same probe WITH
    surface_name, aerodrome_reference_code, reference_point, datum_m_or_ft,
    amsl_basis present must pass.

- id: INV-APC-DECLARED-DISTANCE
  kind: qualifier
  applies_to: {quantity: declared_distance}
  requires: [runway_designator, direction, effective_date, temporary]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.3"}
  message: "declared distance missing {missing}"
  measurement: >-
