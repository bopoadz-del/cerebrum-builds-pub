- id: INV-APC-UNITS-DATUM
  kind: unit_discipline
  applies_to: {quantity: any}
  requires_one_of: [m, ft]
  forbid: [mixed, unspecified]
  severity: refuse
  hook: H2
  evidence: {sheet: "§10"}
  message: "units ambiguous — aviation works in feet, construction in metres"
  measurement: >-
    40 synthetic every declared quantity figures, 10 of them exhibiting mixed,
    unspecified and 20 with none of m, ft stated. Before: 10 were narrated as
    results. After: 10 refused, each naming the unit or datum at fault. The 30
    correctly-dimensioned figures must all still pass.

- id: INV-APC-WGS84
  kind: unit_discipline
  applies_to: {quantity: any, claim_class: position}
  requires: [wgs84_confirmed]
  severity: refuse
  hook: H2
  evidence: {sheet: "§10"}
  message: "position without WGS-84 confirmation"
  measurement: >-
    40 synthetic every declared quantity figures, 10 of them exhibiting an
    ambiguous unit and 20 with none of wgs84_confirmed stated. Before: 10 were
    narrated as results. After: 10 refused, each naming the unit or datum at fault.
    The 30 correctly-dimensioned figures must all still pass.

- id: INV-APC-MAGNETIC
  kind: unit_discipline
  applies_to: {quantity: any, claim_class: bearing}
  requires: [magnetic_or_true]
  severity: refuse
  hook: H2
  evidence: {sheet: "§10"}
  message: "bearing without magnetic/true basis — runway designator is magnetic"
  measurement: >-
    40 synthetic every declared quantity figures, 10 of them exhibiting an
    ambiguous unit and 20 with none of magnetic_or_true stated. Before: 10 were
    narrated as results. After: 10 refused, each naming the unit or datum at fault.
    The 30 correctly-dimensioned figures must all still pass.

- id: INV-APC-PROVENANCE
  kind: provenance
  applies_to: {quantity: any}
  forbid: [carry_from_similar_runway, interpolate_ols_without_code, interpolate_declared_distance_without_qualifier, use_unverifiable_currency]
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.4.1"}
  message: "forbidden derivation: {value}"
  measurement: >-
    Probe every declared quantity x20 with a figure carried attempting
    carry_from_similar_runway, interpolate_ols_without_code,
    interpolate_declared_distance_without_qualifier, use_unverifiable_currency.
    Before: n answers quoted it without remark. After: 0 quoted, and n refusals
    naming which boundary was crossed. Over-refusal check (the bug this kind had by
    hand): a companion probe naming ONE entity twice — what a CORRECT answer looks
    like — must NOT refuse.

- id: INV-APC-CURRENCY
  kind: currency
  applies_to: {quantity: declared_distance}
  window: {provider: airac_cycle, max_age: next_cycle}
  severity: refuse
  hook: H3
  evidence: {sheet: "§5.5"}
  message: "declared distance stale on {value}"
  measurement: >-
    Probe declared_distance x20 after a airac_cycle_change event, then x20 with
    airac_cycle unreachable. Before: n answers quoted the superseded figure, and
    the unreachable case fell back to the design basis. After: 0 superseded
    figures; 20 refusals naming airac_cycle_change and 20 reporting state UNKNOWN
    with no design figure in the refusal.

# ---------------------------------------------------------------------------
# Correction 6: engine-required completions of the DECLARED staleness
# triggers. ols_geometry, ils_critical_area, rsa_limit, pcn, agl_unserviceable
# and phasing_plan are named in staleness_triggers but no currency invariant
# above governs them (INV-APC-CURRENCY governs declared_distance only) — a
# declared trigger nothing checks is a rule that reports green while gating
# nothing, and the loader refuses it. These records add only the provider
# wiring — no new rule, no new event, no new state provider.
# ---------------------------------------------------------------------------

- id: INV-APC-CURRENCY-OLS-GEOMETRY
  kind: currency
  applies_to: {quantity: ols_geometry}
  window: {provider: phasing_plan_current, max_age: event}
  severity: refuse
  hook: H3
  evidence: {sheet: "staleness_triggers"}
  message: "OLS geometry is stale once an obstacle change or a safeguarding revision has happened"
  measurement: >-
    Probe ols_geometry x20 after a obstacle_change event, then x20 with
    phasing_plan_current unreachable. Before: n answers quoted the superseded
    figure, and the unreachable case fell back to the design basis. After: 0
    superseded figures; 20 refusals naming obstacle_change and 20 reporting state
    UNKNOWN with no design figure in the refusal.

