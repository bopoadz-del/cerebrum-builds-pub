# Railway & Metro Construction reasoning layer — track/civils design basis.
#
# Source of truth: the domain encoding sheet for Railway & Metro Construction.
# NO INTERVIEW HAS RUN. Every `value` below is null on purpose and stays null
# until the interview fills it; see KNOWN_GAPS.md.
#
# A null value is legal. A MISSING QUALIFIER IS NOT: TrackBasis (reasoning.py)
# refuses any figure that does not carry every key in MANDATORY_QUALIFIERS, at
# load time, naming the figure and the keys it lacks. A half-qualified figure
# is how a maintenance-tier limit ends up answering a safety-tier question.
#
# This file is read ONLY for interview/provenance bookkeeping (TrackBasis:
# interview_status, unfilled()). It is not consulted by the gate itself — the
# gate is app/blocks/rail/manifest.yaml + invariants.yaml, evaluated by the
# shared kit_engine. Moved out of manifest.yaml so the kit_engine's manifest
# loader (app/blocks/kit_engine/manifest.py) sees only the portable vocabulary
# shape it knows how to parse.
#
# category is part of the identity of every geometry figure, not a label on
# it:
#   plain_line              running line, ballasted or slab track
#   switches_and_crossings  turnouts, crossings — different limits, same units
#   bridge_approach         transition zone, stiffness change
#   tunnel                  bored or cut-and-cover, TBM-adjacent
# Nothing interpolates between them (INV-RAIL-CATEGORY-CARRY, invariants.yaml).
source: "domain encoding sheet, Railway & Metro Construction"
scope: "route- and line-specific — never carry a figure to another route, line, category or asset"
