# Fire protection & firefighting systems — design basis figures.
#
# Moved out of manifest.yaml so manifest.yaml can hold the portable vocabulary
# shape the shared kit_engine evaluator expects. This file is unchanged
# content: the same source of truth, the same eleven figures, the same
# MANDATORY_QUALIFIERS on every one of them.
#
# Source of truth: the domain encoding sheet for Fire Protection & Firefighting
# Systems. NO INTERVIEW HAS RUN. Every `value` below is null on purpose and
# stays null until the interview fills it; see KNOWN_GAPS.md.
#
# A null value is legal. A MISSING QUALIFIER IS NOT: FireProtectionBasis
# refuses any figure that does not carry every key in MANDATORY_QUALIFIERS, at
# load time, naming the figure and the keys it lacks. A half-qualified figure
# is how an unclassified density table ends up answering a classified
# question.
#
# design_area_basis is part of the identity of a density figure, not a label
# on it: most_remote and most_demanding are never interchangeable, and a
# figure filled under one does not answer a question under the other.
source: "domain encoding sheet, Fire Protection & Firefighting Systems"
scope: "building- and system-specific — never carry to another building, tenant or code edition"
