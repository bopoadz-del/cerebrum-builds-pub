  - id: '9.4.2'
    section: '9'
    gate: true
    text: >-
      Confirm your classification rule — never a classification without a named engineer or
      approved document.
  - id: '9.5'
    section: '9'
    gate: true
    covers: [hazard_classification]
    text: >-
      Staleness rules per figure — impairment status, flow test, hazard classification,
