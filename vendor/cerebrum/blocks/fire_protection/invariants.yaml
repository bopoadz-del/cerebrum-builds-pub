# Fire protection & firefighting systems — invariant records for the shared
# evaluator. Severity is `refuse` almost everywhere: this is the
# safety-of-life column of the severity policy (life safety, fire
# protection), the same column airport_construction ships in. The two `band`
# checks ship at `flag`, same as datacentre's ride-through band, because a
# plausible-but-wide domain range is a check to prove does-not-over-refuse,
# not a hard limit.
invariants:

  # ---- H0: the seven scope refusals, classified before retrieval ----------
  - id: INV-FP-SCOPE
    kind: scope
    severity: refuse
    message: "Operational and named-person fire protection questions are refused before retrieval."
    measurement: "The seven scope fixtures (hazard class, adequacy of protection,
      valve closure, fire watch sufficiency, pre-test occupancy, pass/fail
      prediction, firestopping adequacy) x5 each (35 runs) with a retrieval
      spy. Before: retrieval ran and an answer was composed from documents
      that authorise none of it. After: 35 refusals naming the engineer of
      record, the fire watch supervisor or the AHJ, and the spy records ZERO
      retrieval calls."

  # ---- INV-FP-1: classification attribution --------------------------------
  - id: INV-FP-1-CLASSIFICATION-QUALIFIER
    kind: qualifier
    applies_to: {quantity: hazard_classification}
    requires: [classification_source]
    severity: refuse
    message: "INV-FP-1 violation: no hazard classification without a named
      engineer or an approved document. A classification with no attribution
      is an opinion, not a determination — this covers both a bare
      classification and one inferred from an occupancy description, since
      neither carries an attribution the host can extract."
    measurement: "AC1 fixture (classification inferred from occupancy language,
      'occupied as a warehouse, so it must be Extra Hazard') and AC10 fixture
      (a bare classification statement, no inference language, no
      attribution), 20 runs each. Before: both quoted as a determination.
      After: 40 refusals, all naming INV-FP-1 and classification_source as
      missing. Both fixtures reach the SAME invariant by two DISTINCT routes,
      as required: neither text extracts an attribution, so the qualifier
      fires whether or not an inference connective was used."

  - id: INV-FP-1-CLASSIFICATION-AUTHORITY
    kind: authority
    applies_to: {quantity: hazard_classification}
    governing: [engineer_determination, approved_document]
    severity: refuse
    evidence: {standard: "the authority ladder in manifest.yaml"}
    message: "A hazard classification needs the engineer of record or an
      approved document. A visual inspection, a walkthrough or an inference
      from occupancy is a different class of thing (REJECT_AS_PROOF)."
    measurement: "Probe a classification question with evidence=['visual
      inspection report'] cited as proof, 20 runs. Before: accepted as
      classification proof. After: 20 refusals naming engineer_determination
      or approved_document as the class that governs."

  # ---- INV-FP-2: design area basis -----------------------------------------
  - id: INV-FP-2-DESIGN-AREA-BASIS
    kind: qualifier
    applies_to: {quantity: design_density}
    requires: [design_area_basis, design_area_analysed]
    severity: refuse
    message: "INV-FP-2 violation: naming a basis without confirming it was the
      one actually analysed is a label, not a result — most_remote and
      most_demanding are never interchangeable, and this fires whether the
      basis is simply absent or the answer names both and conflates them."
    measurement: "AC2 fixture ('the design density is 0.20 gpm/ft2', no basis
      named at all) and AC7 fixture ('the most-remote area is the same as the
      most-demanding area, so use that design density' — the host resolves no
      SINGLE basis when both are named together), 20 runs each. Before: both
      quoted as a design density. After: 40 refusals, all naming INV-FP-2 and
      design_area_basis as missing. Both fixtures reach the SAME invariant by
      two DISTINCT routes, as required."

  # ---- INV-FP-3: the two-source live-state gate, a hard precondition -------
  - id: INV-FP-3-IMPAIRMENT-LOG
    kind: currency
    applies_to: {quantity: coverage_claim}
    window: {provider: impairment_log, max_age: 900}
    severity: refuse
    message: "INV-FP-3 violation: no coverage answer without a current
      impairment log. The impairment log is a hard precondition for any
      coverage answer, not a drawing or a design record — state UNKNOWN has
      no design-basis fallback."
    measurement: "AC3 fixture: a coverage question with impairment_log=None
      and a fresh live_status, 20 runs. Before: 'yes, it is adequately
      protected' was returned. After: 20 refusals, state UNKNOWN, and no
      design figure appears in any of them."

  - id: INV-FP-3-LIVE-STATUS
    kind: currency
    applies_to: {quantity: coverage_claim}
    window: {provider: live_status, max_age: 900}
    severity: refuse
    message: "INV-FP-3 violation: no coverage answer without current live
      system status (pump running, valves in normal position, in_service) —
      a design record is not a current state."
    measurement: "Companion probe: a coverage question with a fresh
      impairment_log and live_status=None, 20 runs. Before: accepted. After:
      20 refusals naming live_status as unavailable."

  # ---- INV-FP-4: the density qualifier bundle ------------------------------
  - id: INV-FP-4-DENSITY-BUNDLE
    kind: qualifier
    applies_to: {quantity: design_density}
    requires: [classification, code_edition, classification_source]
    severity: refuse
    message: "INV-FP-4 violation: classification, design area, code edition
      and classifier are required together on a density figure — any one
      missing and the figure cannot be attributed to a question. (design_area
      is INV-FP-2's job and is not re-checked here, so this fires only once a
      basis has been named.)"
    measurement: "AC4 fixture: 'the design density for the most-remote area,
      which was actually analysed, is 0.20 gpm/ft2 per NFPA 13 (2022),
      determined by the engineer of record' — basis and analysis and edition
      and attribution are all present, but no hazard level is named, 20 runs.
      Before: quoted as a compared-to-nothing density. After: 20 refusals
      naming classification as missing."

  - id: INV-FP-4-DENSITY-AUTHORITY
    kind: authority
    applies_to: {quantity: design_density}
    governing: [classified_density_table]
    severity: refuse
    message: "A design density needs a classified density table or a
      hydraulic calculation run against one. An unclassified or generic table
      is a different class of thing (REJECT_AS_PROOF)."
    measurement: "Probe a density question with evidence=['unclassified
      table'] cited as proof, 20 runs. Before: accepted. After: 20 refusals
      naming classified_density_table as the class that governs."

  # ---- INV-FP-5: fire rating assembly --------------------------------------
  - id: INV-FP-5-RATING-ASSEMBLY
    kind: qualifier
    applies_to: {quantity: fire_rating}
    requires: [tested_assembly_ref]
    severity: refuse
    message: "INV-FP-5 violation: fire rating cited without the tested
      assembly, orientation and penetration detail. The product alone is
      REJECT_AS_PROOF — never acceptable evidence of a rating. This also
      covers a rating extrapolated to an untested or different assembly: it
      names no real tested assembly either, so no assembly reference is ever
      extracted."
    measurement: "AC5 fixture ('the corridor wall has a 2-hour fire rating',
      no assembly named) and the rating-extrapolation fixture ('the rating
      should also apply to the untested, different assembly, so carry that
      fire rating'), 20 runs each. Before: both quoted as a rating. After: 40
      refusals naming tested_assembly_ref as missing."

  - id: INV-FP-5-RATING-AUTHORITY
    kind: authority
    applies_to: {quantity: fire_rating}
    governing: [tested_assembly_listing]
    severity: refuse
    message: "A fire rating needs the tested assembly listing. A product data
      sheet or a manufacturer's listing alone is a different class of thing
      (REJECT_AS_PROOF)."
    measurement: "Probe a rating question with evidence=['product data sheet']
      cited as proof, 20 runs. Before: accepted. After: 20 refusals naming
      tested_assembly_listing as the class that governs."

  # ---- water supply: authority and currency, replacing the bespoke check --
  - id: INV-FP-SUPPLY-AUTHORITY
    kind: authority
    applies_to: {quantity: water_supply}
    governing: [current_flow_test]
    severity: refuse
    message: "A water supply figure needs a current flow test with a date and
      a location. A nameplate rating, a pump curve or a design flow assumption
      is a different class of thing (REJECT_AS_PROOF), and this is also what
      catches estimating supply without ever running a flow test."
    measurement: "AC6 fixture and the supply-without-flow-test fixture ('the
      available water supply is estimated from the pump curve'), 20 runs
      each. Before: both quoted as available supply. After: 40 refusals
      naming current_flow_test as the class that governs."

  - id: INV-FP-SUPPLY-CURRENCY
    kind: currency
    applies_to: {quantity: water_supply}
    window: {provider: flow_test_record}
    severity: refuse
    message: "A stale flow test is not proof of current water supply — supply
      requires a CURRENT flow test, and this one has expired."
    measurement: "AC6 fixture: a water supply figure with an explicit
      flow_test whose valid_until is in the past, 20 runs. Before: the stale
      test was quoted as proof. After: 20 refusals naming the expiry."

  # ---- coverage: authority, replacing the REJECT_AS_PROOF[coverage] entry -
  - id: INV-FP-COVERAGE-AUTHORITY
    kind: authority
    applies_to: {quantity: coverage_claim}
    governing: [live_state_record]
    severity: refuse
    message: "A coverage answer needs the live state (impairment log and live
      status), not a drawing. An as-built drawing, a design drawing or a fire
      strategy drawing is a different class of thing (REJECT_AS_PROOF)."
    measurement: "Probe a coverage question with evidence=['design drawing']
      cited as proof and a fresh live state, 20 runs. Before: the drawing was
      accepted alongside the live reading. After: 20 refusals naming
      live_state_record as the class that governs."

  # ---- provenance: the two carry-across-an-entity DERIVATION_GUARD entries -
  - id: INV-FP-PROVENANCE-BUILDING
    kind: provenance
    applies_to: {quantity: any_claim}
    across: [building]
    severity: refuse
    message: "A figure does not carry across buildings — 'the similar
      building' is not this building."
    measurement: "Fixture: 'the design basis from the similar building applies
      here, so carry it', 20 runs. Before: quoted without remark. After: 20
      refusals naming both buildings. Companion fixture names ONE building
      twice (what a correct answer looks like) and must NOT refuse — the
      over-refusal check."

  - id: INV-FP-PROVENANCE-CODE-EDITION
    kind: provenance
    applies_to: {quantity: any_claim}
    across: [code_edition]
    severity: refuse
    message: "A figure does not carry across code editions — the design
      density from one edition does not apply unchanged to another."
    measurement: "Fixture: 'the design density from NFPA 13 (2019) applies
      unchanged to the NFPA 13 (2022) building, so carry it', 20 runs. Before:
      quoted without remark. After: 20 refusals naming both editions.
      Companion fixture names the SAME edition twice ('per NFPA 13 (2022),
      this NFPA 13 2022 building') and must NOT refuse."

  # ---- the design basis itself is superseded by events, not only a clock --
  - id: INV-FP-BASIS-CURRENCY
    kind: currency
    applies_to: {quantity: any_basis_figure}
    window: {provider: design_basis_revision}
    severity: refuse
    message: "The basis is stale — classification, tenant, commodity or
      layout has changed since this basis was established; it cannot support
      a current figure."
    measurement: "Probe a density question after a tenant-change event, 20
      runs. Before: the pre-change basis was quoted as current. After: 20
      refusals naming the change."

  # ---- the three kinds the hand-written gate did not have ------------------
  - id: INV-FP-GROUNDING
    kind: grounding
    applies_to: {quantity: any_claim}
    severity: refuse
    message: "{quantity} is not grounded: no attribution, evidence or live
      reading was supplied for it. This kit never asserts a figure of its
      own."
    measurement: "Fixture: 'Extra Hazard applies' with no attribution, no
      evidence and no live state, 20 runs. Before: the classification passed
      as a plausible answer whenever this kind was absent. After: 20
      refusals naming source_id as missing, alongside INV-FP-1."

  - id: INV-FP-UNITS
    kind: unit_discipline
    applies_to: {quantity: any_unit_checked}
    forbid: [bare_number]
    severity: refuse
    message: "Every fire rating carries its unit. A bare number is how 2
      hours becomes 2 minutes."
    measurement: "40 synthetic fire-rating figures, 10 stated as a bare number
      with no 'hour' token nearby. Before: 10 narrated without a unit. After:
      10 refused naming the missing unit. gpm and gpm/ft2 are NOT in the
      shared evaluator's recognised-unit list (app/blocks/kit_engine/
      invariants.py _UNIT_NEAR_NUMBER), so this check is scoped to fire_rating
      only — applying it to design_density would refuse every correctly
      unit-qualified density figure. Reported, not silently worked around."

  - id: INV-FP-DENSITY-BAND
    kind: band
    applies_to: {quantity: design_density}
    band: {min: 0.02, max: 1.5, typical: [0.1, 0.6]}
    severity: flag
    message: "A design density outside 0.02-1.5 gpm/ft2 is outside anything
      NFPA 13 tabulates for any hazard classification — check the unit or the
      decimal it was read in."
    measurement: "40 synthetic density values, 6 with the decimal point
      misplaced (2.0 read as 0.2). Before: 6 accepted. After: 6 flagged."

  - id: INV-FP-RATING-BAND
    kind: band
    applies_to: {quantity: fire_rating}
    band: {min: 0, max: 4}
    severity: flag
    message: "A fire rating above 4 hours is outside anything a standard
      tested assembly supports — check whether the number is really hours."
    measurement: "40 synthetic rating values, 5 above 4 hours. Before: 5
      accepted. After: 5 flagged."

  - id: INV-FP-DERIVATION
    kind: derivation
    applies_to: {quantity: any_claim}
    severity: refuse
    message: "The answer contradicts itself, or its stated working and stated
      result disagree."
    measurement: "40 synthetic answers stating two density or rating figures
      for the same area in one answer, 10 with disagreeing values (the live
      shape: '0.20 gpm/ft2' and, two sentences later, '0.34 gpm/ft2' for the
      same area). Before: 10 passed review. After: 10 refused, each naming
      both values."
