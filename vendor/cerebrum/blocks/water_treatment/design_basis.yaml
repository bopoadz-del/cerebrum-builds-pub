# Water treatment plant operations reasoning layer — treatment basis.
#
# Source of truth: the domain encoding sheet for Water Treatment Plant
# Operations. NO INTERVIEW HAS RUN. Every `value` below is null on purpose and
# stays null until the interview fills it; see KNOWN_GAPS.md.
#
# A null value is legal. A MISSING QUALIFIER IS NOT: the loader refuses any
# figure that does not carry every key in MANDATORY_QUALIFIERS, at load time,
# naming the figure and the keys it lacks. A half-qualified figure is how a
# CT value computed at the wrong temperature/pH row ends up answering a
# different disinfection question.
#
# contact_time_basis is part of the identity of every contact-time figure,
# not a label on it:
#   theoretical   hydraulic design value only — never proof where T10 is required
#   T10           10th-percentile detention from a tracer study, baffling factor applied
#   tracer        the tracer study result itself
# Nothing carries between them. See DERIVATION_GUARD in reasoning.py.
#
# dose_basis is likewise part of the identity of every dose figure:
#   as_product    the commercial product as delivered (e.g. 12.5% trade NaOCl)
#   as_active     the active ingredient (e.g. as Cl2, as Al2O3) — what the
#                 process calculation actually needs
# The nameplate/rated strength of a chemical is never a substitute for the
# delivered, measured strength: see the "nameplate hypochlorite strength"
# derivation guard entry.
source: "domain encoding sheet, Water Treatment Plant Operations"
scope: "plant- and train-specific — never carry to another plant or train"
interview_status: "not run — every value is null (KNOWN_GAPS.md)"

