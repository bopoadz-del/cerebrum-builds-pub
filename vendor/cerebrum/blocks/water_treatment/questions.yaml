questions:
  - id: '1.1'
    section: '1'
    gate: true
    text: >-
      Your dosing catalogue — for each chemical (coagulant, coagulant aid/polymer, acid,
      caustic/lime, chlorine gas, hypochlorite, ammonia/chloramine, ClO₂, ozone, fluoride,
      corrosion inhibitor, antiscalant, membrane cleaning, bisulfite) — form and strength
      as delivered, typical dose, range, what drives the dose, unit cost — with source.
  - id: '1.2'
    section: '1'
    gate: true
    text: >-
      Whether your hypochlorite dose calculation uses nameplate or measured strength, and
      how often you measure delivered strength.
  - id: '1.3'
    section: '1'
    gate: true
    text: >-
      Which doses on your plants are set by jar test, online control, or standing recipe —
      and who may change a standing recipe.
  - id: '1.4'
    section: '1'
    gate: true
    text: >-
      What changes the dose on your raw water — turbidity, temperature, algae, TOC, pH,
      season — and the relationship, if you have one.
  - id: '1.5'
    section: '1'
    gate: true
    text: >-
      Which chemicals have a maximum permissible dose on your permits for a regulatory
      reason.
  - id: '2.1'
    section: '2'
    gate: true
    covers: [chlorine_residual]
    text: >-
      Your compliance limit set — turbidity (combined filter, individual filter), free
      chlorine residual (plant outlet, distribution far point), total/chloramine residual,
      pH, coliform/E. coli, Giardia log, virus log, Cryptosporidium log, THMs, HAAs,
      bromate, chlorite, fluoride, lead/copper, nitrate/nitrite, conductivity/TDS, boron —
      with limit, averaging basis, monitoring frequency, regulation, consequence of
      exceedance.
  - id: '2.2'
    section: '2'
    gate: true
    text: >-
      Which limits on your permits are instantaneous, running average, or percentile-based.
  - id: '2.3'
    section: '2'
    gate: true
    text: >-
      Which exceedances require notification, to whom, within what time on your permits.
  - id: '2.4'
    section: '2'
    gate: true
    text: >-
      Which require a public advisory on your permits — boil notice, do-not-drink,
      do-not-use — and what triggers each.
  - id: '2.5'
    section: '2'
    gate: true
    covers: [analyser]
    text: >-
      Which parameters on your plants are measured continuously vs grab sample, and where
      the compliance value comes from when the analyser is down.
  - id: '3.1'
    section: '3'
    gate: true
    text: >-
      Your cost set — plant shutdown per hour, reduced output per %, water purchased per
      m³, tankering per m³, boil-water notice direct cost and per continuing day,
      do-not-drink notice, regulatory penalty per exceedance, reservoir drain and
      disinfect, main flush and re-sample, distribution repressurisation, customer
      compensation.
  - id: '3.2'
    section: '3'
    gate: true
    text: >-
      How long you can supply from storage before an interruption reaches customers — per
      plant or zone.
  - id: '3.3'
    section: '3'
    gate: true
    text: >-
      Your step cost — the point where a problem stops being operational and becomes public
      on your network.
  - id: '3.4'
    section: '3'
    gate: true
    text: >-
      Your energy cost per m³ produced, and how it changes with tariff period.
  - id: '4.1'
    section: '4'
    gate: true
    covers: [ct_achieved, ct_required, log_inactivation]
    text: >-
      Your definition and inputs for each — chlorine demand, applied dose for target
      residual, CT achieved, CT required, inactivation ratio, log inactivation per segment,
      log inactivation plant total, breakpoint, chloramine ratio, ozone CT/dose transfer,
      UV dose/RED — with the regulation or method each follows and who owns it.
  - id: '4.2'
    section: '4'
    gate: true
    covers: [contact_time]
    text: >-
      Which value of contact time your plants use — theoretical detention, T10, or
      tracer-derived — and for T10, whether it is from a baffling factor or a tracer study,
      and the date.
  - id: '4.3'
    section: '4'
    gate: true
    text: >-
      At what flow CT is calculated on your plants — peak hourly, average, or other — as
      your permits or practice require.
  - id: '4.4'
    section: '4'
    gate: true
    text: >-
      Where C is measured on your plants, and whether before or after the first customer.
  - id: '4.5'
    section: '4'
    gate: true
    covers: [ct_required]
    text: >-
      How temperature and pH change CT_required on your tables — your specific values.
  - id: '4.6'
    section: '4'
    gate: true
    text: >-
      How actual tank level is accounted for in the CT calculation when the contact tank is
      not full.
  - id: '4.7'
    section: '4'
    gate: true
    text: >-
      How many disinfection segments your train has, and how log inactivations are summed.
  - id: '4.8'
    section: '4'
    gate: true
    covers: [contact_time]
    text: >-
      When your contact time was last re-determined, and what changes trigger
      redetermination on your plants.
  - id: '5.1'
    section: '5'
    gate: true
    covers: [membrane_flux]
    text: >-
      Your inputs and method for each — filter loading rate, filter run length/terminal
      head loss, backwash rate and duration, filter-to-waste/ripening, clarifier surface
      loading, detention times, sludge production and blanket level, membrane flux,
      TMP/normalised permeability, recovery and concentration factor, specific energy
      (desal), Langelier/stability index, chemical feed pump setting, storage
      turnover/water age — with the standard each follows.
  - id: '5.2'
    section: '5'
    gate: true
    text: >-
      What triggers a backwash on your filters — head loss, turbidity breakthrough, run
      hours, or whichever first — and your terminal turbidity that must not be exceeded.
  - id: '5.3'
    section: '5'
    gate: true
    text: >-
      Your filter-to-waste requirement after backwash, and whether it can be skipped under
      any circumstance on your plants.
  - id: '5.4'
    section: '5'
    gate: true
    text: >-
      For membranes, your normalised performance decline that triggers a clean, and that
      triggers replacement.
  - id: '6.1'
    section: '6'
    gate: true
    text: >-
      Your priority order when raw water deteriorates or a unit fails.
  - id: '6.2'
    section: '6'
    gate: true
    text: >-
      What makes each option impossible on your plants — increase dose, reduce output, take
      a filter/train offline, run with a unit bypassed, draw down storage, import from
      alternative source, shut down and issue notice, restart after shutdown.
  - id: '6.3'
    section: '6'
    gate: true
    text: >-
      Your hard limits that can never be traded, whatever the demand pressure.
  - id: '6.4'
    section: '6'
    gate: true
    text: >-
      Your authority matrix — operate outside normal dose envelope, bypass a treatment
      unit, skip filter-to-waste, return a filter after a turbidity spike, accept water
      into distribution after an exceedance, issue a boil-water notice, lift a notice,
      enter a chlorine room or confined space.
  - id: '7.1'
    section: '7'
    gate: true
    text: >-
      For chlorine gas if used — your exposure limits, alarm setpoints, evacuation trigger,
      scrubber/containment provision, who is trained, where SCBA is kept.
  - id: '7.2'
    section: '7'
    gate: true
    text: >-
      For each bulk chemical on your sites — incompatibilities, bunding and containment
      volume, spill response, PPE, and what must never be stored or dosed adjacent.
  - id: '7.3'
    section: '7'
    gate: true
    text: >-
      Your confined spaces on site, and your atmospheric entry limits as practised.
  - id: '7.4'
    section: '7'
    gate: true
    text: >-
      Your maximum storage quantities on site for regulatory reasons (not practical).
  - id: '7.5'
    section: '7'
    gate: true
    text: >-
      Your written emergency protocols — gas release, dose failure, contamination event,
      power loss, flood — and where they are kept.
  - id: '8.1'
    section: '8'
    gate: true
    covers: [chemical_dose, contact_time, ct_required]
    text: >-
      Per figure class — compliance limit, CT_required, contact time/T10, chemical dose,
      filter loading rate, exposure limit, log credit for a process — what your
      organisation accepts as proof, and what it rejects even if it states the number.
  - id: '8.2'
    section: '8'
    gate: true
    covers: [operating_manual, permit]
    text: >-
      Minimum acceptable citation per source type — national regulation/standard, permit,
      CT table (temperature, pH, disinfectant), plant operating manual, chemical
      datasheet/SDS, tracer study report (date, conditions), equipment manual, laboratory
      method.
  - id: '8.3'
    section: '8'
    gate: true
    covers: [chemical_dose, chlorine_residual, contact_time, ct_required, turbidity_limit]
    text: >-
      Mandatory qualifiers your organisation requires — CT_required (temperature, pH,
      disinfectant, target organism, log target), contact time (basis, flow, tank level
      assumption), chlorine residual (free/total, sample point, before/after first
      customer), turbidity limit (combined/individual, instantaneous/percentile), chemical
      dose (as product or as active, delivered strength), exposure limit
      (TWA/STEL/ceiling).
  - id: '8.4'
    section: '8'
    gate: true
    covers: [log_inactivation]
    text: >-
      Your derivation rules — multiplying C × T, interpolating CT tables, converting
      theoretical detention to T10 by baffling factor, converting dose as-product to
      as-active, scaling dose from a different flow, summing log inactivation across
      segments, carrying a figure from a similar plant, using nameplate rather than
      measured strength — allowed or not on your plants.
  - id: '8.5'
    section: '8'
    gate: true
    covers: [analyser, chemical_strength, operating_manual, permit]
    text: >-
      Your staleness rules per figure — tracer study/T10, permit limit, baffling factor,
      delivered chemical strength, jar test result, analyser calibration, operating manual
      — valid for how long, stale immediately on what.
  - id: '8.5.2'
    section: '8'
    gate: true
    covers: [permit]
    text: >-
      Confirm the currency rule — does the system refuse or warn when it cannot verify a
      permit or manual is current? (Given public-health consequence — confirm.)
  - id: '8.6'
    section: '8'
    gate: true
    covers: [operating_manual, permit]
    text: >-
      Your conflict resolution — permit vs national standard (stricter and looser),
      operating manual vs regulation.
  - id: '8.6.3'
    section: '8'
    gate: true
    text: >-
      Confirm the conflict rule — does the system refuse to answer when two sources
      conflict on a compliance limit, and report the conflict instead?
  - id: '8.7'
    section: '8'
    gate: false
    text: >-
      Partial-evidence disclosure wording, and which figures must never be offered as
      estimates — confirmed against your Section 9 list.
  - id: '9.1'
    section: '9'
    gate: true
    covers: [contact_time, ct_required, log_inactivation]
    text: >-
      Which figures your organisation treats as absolute — CT_required for the day's
      temperature and pH, T10 contact time, turbidity compliance limits (combined and
      individual filter), chlorine gas exposure limit, log inactivation credits by process,
      residual minimums and maximums, DBP limits, maximum chemical doses with a regulatory
      basis, chlorine gas exposure/evacuation, confined-space entry limits, maximum filter
      loading rates, filter-to-waste requirements, membrane integrity test limits, storage
      and containment quantity limits.
  - id: '9.2'
    section: '9'
    gate: false
    text: >-
      Which of the above have caught you out, and how.
  - id: '10.1'
    section: '10'
    gate: false
    text: >-
      Figures you accept as estimates — expected filter run length, chemical consumption
      forecast, sludge production — and the exact wording you want attached.
  - id: '11.1'
    section: '11'
    gate: true
    text: >-
      Your list of questions that must be refused outright — is this water safe to supply,
      can we skip filter-to-waste, do we need a boil notice, can I enter the chlorine room
      — and what the system should say instead.
  - id: '12.1'
    section: '12'
    gate: true
    covers: [operating_manual, permit]
    text: >-
      Your ranking, highest first — national drinking water regulation,
      abstraction/discharge permit, health authority directive, design basis/process design
      report, tracer study, plant operating manual, SOP, shift instruction, chemical
      supplier advice.
  - id: '12.2'
    section: '12'
    gate: true
    covers: [permit]
    text: >-
      When your permit is stricter than the national standard — which governs. When it is
      looser.
  - id: '12.3'
    section: '12'
    gate: true
    covers: [operating_manual]
    text: >-
      When operating manual and design basis disagree on your plants — which governs.
  - id: '12.4'
    section: '12'
    gate: true
    covers: [permit]
    text: >-
      How anyone knows the permit version in use is current on your plants.
  - id: '12.5'
    section: '12'
    gate: false
    text: >-
      Which figures are plant-specific on your estate and never carried between plants.
  - id: '12.6'
    section: '12'
    gate: false
    text: >-
      Which are train- or filter-specific rather than plant-standard.
  - id: '13.1'
    section: '13'
    gate: false
    text: >-
      Where an as-product vs as-active dose error has occurred on your plants.
  - id: '13.2'
    section: '13'
    gate: false
    covers: [contact_time]
    text: >-
      Where a contact time basis error has occurred on yours.
  - id: '13.3'
    section: '13'
    gate: false
    text: >-
      Where a free vs total chlorine confusion has occurred on yours.
  - id: '14.1'
    section: '14'
