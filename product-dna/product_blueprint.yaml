schema_version: product_blueprint.v1
product_id: product
product_name: Harbourline Civil Works Contracts Administration
vertical: product
summary: A contracts-administration platform for the Harbourline Civil Works project
  that treats the uploaded contract excerpt and BOQ as the source of record. It manages
  progress claims certified against BOQ line items, tracks delay damages under Clause
  8.7, maintains QA/ITP records, and runs a controlled document register with revision
  history. It serves the project's contract administrator, quantity surveyor, QA engineer,
  and document controller, keeping every claim, deduction, and record traceable ba
capabilities:
- id: document_register
  description: A controlled register of project documents (contract, BOQ, drawings,
    ITPs) with revision, status, issue and transmittal history. Each entry cites its
    source document, including document:402ecf72034f4692898b07cd2079bed2_harbourline_boq.xlsx
    and document:a2e79e3d662b42f1b56d5faafd651ffe_harbourline_co
  block_ids:
  - document_engine
  - version
  - version_diff
  - storage
  - audit_chain
  strategy_hint: REUSE
  required: true
  connectors: []
- id: progress_claims
  description: Prepare interim payment certificates by measuring completed work against
    BOQ items (P1–P5, E1–E5) and applying Clause 14.3 retention of 5% per certificate.
    Produces a claim schedule with quantities, rates and certified amounts traceable
    to the BOQ source document.
  block_ids:
  - boq_processor
  - formula_executor
  - finance_reconciliation
  - approval_rules
  - pdf
  strategy_hint: REUSE
  required: true
  connectors: []
- id: delay_damages_tracking
  description: Tracks time for completion under Clause 8.2 (730 days) and computes
    delay damages under Clause 8.7 at 0.1% of the Accepted Contract Amount per day,
    capped at 10%. Records the Accepted Contract Amount, commencement date, extensions
    and days of delay with a running liability balance.
  block_ids:
  - cpm_engine
  - formula_executor
  - finance_planning
  - audit
  strategy_hint: REUSE
  required: true
  connectors: []
- id: qa_itp_records
  description: Captures Inspection and Test Plan (ITP) records — inspection lots,
    hold and witness points, results, sign-offs and non-conformance reports — linked
    to the relevant BOQ work sections and project documents.
  block_ids:
  - document_engine
  - evidence_chain
  - validation
  - workflow
  strategy_hint: REUSE
  required: true
  connectors: []
- id: contract_clause_governance
  description: Indexes the contract excerpt clauses (8.2, 8.7, 11.1, 14.3, 4.2) as
    governed rules so that retention percentages, delay-damages rates, caps, and defects-notification
    periods are applied consistently by every other capability and can be audited
    against the source document.
  block_ids:
  - knowledge
  - regulatory_chunker
  - evidence_or_refuse
  - governance_gate
  strategy_hint: REUSE
  required: true
  connectors: []
- id: payment_security_and_retention_ledger
  description: Maintains the Performance Security position under Clause 4.2 (10% of
    the Accepted Contract Amount) and the Clause 14.3 retention ledger, releasing
    50% at Taking-Over and 50% at the end of the Defects Notification Period (Clause
    11.1, 365 days).
  block_ids:
  - finance_canonical_model
  - transaction_state_machine
  - audit_chain
  strategy_hint: REUSE
  required: true
  connectors: []
- id: claims_analytics_dashboard
  description: A dashboard showing certified-to-date versus BOQ value, retention held,
    delay-damages exposure, ITP close-out status and register completeness, so the
    project team can see contract position at a glance.
  block_ids:
  - dashboard
  - analytics
  - portfolio_rollup
  strategy_hint: REUSE
  required: true
  connectors: []
ui_modules:
- command_center
- operational_chat
- resident_engineer
connectors: []
edge_profile: standard
serves_verticals: []
canonical_output: null
build_level: production
