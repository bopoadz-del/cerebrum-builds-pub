schema_version: product_blueprint.v1
product_id: product
product_name: car manufacturing platform
vertical: product
summary: 'A pilot platform for manager-level users at two electric-car plants in Morocco,
  each running five production lines on 12-hour shifts around the clock. It puts a
  reasoning layer over money and documents: it tracks supplier costs, parts pricing
  and invoicing in MAD, plugs into SAP ERP for costing/invoicing data, and answers
  managers'' questions grounded in documents they upload (BOMs, work instructions,
  quality procedures, supplier price lists) sourced from Microsoft 365 (OneDrive/Outlook)
  and uplo'
capabilities:
- id: document_grounded_qa
  description: Managers ask natural-language questions grounded in uploaded documents
    (BOMs, work instructions, quality procedures, supplier price lists); the system
    retrieves the relevant passages across both plants and answers from them, citing
    the source.
  block_ids:
  - knowledge
  - search
  - vector_search
  - llm_enhancer
  - ocr
  strategy_hint: REUSE
  required: true
  connectors: []
- id: supplier_cost_and_parts_pricing
  description: Tracks supplier costs, parts pricing and invoices in MAD, pulls costing
    and invoicing data from SAP ERP, and holds the money model the reasoning layer
    reasons over.
  block_ids:
  - finance_canonical_model
  - finance_import
  - finance_data_quality
  - finance_reconciliation
  - validation
  strategy_hint: REUSE
  required: true
  connectors:
  - sap_erp
- id: cost_price_movement_alerts
  description: Watches supplier cost and parts price movements (on POs and invoices)
    against manager-set thresholds in MAD, and raises alerts with an emailed Outlook
    notification and a dashboard entry.
  block_ids:
  - approval_rules
  - notification
  - email
  - analytics
  - dashboard
  strategy_hint: REUSE
  required: true
  connectors:
  - outlook
- id: document_revision_nudges
  description: Detects when a work instruction or quality procedure is revised in
    Microsoft 365 or on upload, and nudges affected managers by Outlook email and
    on the dashboard.
  block_ids:
  - version_diff
  - microsoft_365
  - notification
  - email
  - audit
  strategy_hint: REUSE
  required: true
  connectors: []
- id: document_ingestion_from_m365_and_upload
  description: Ingests BOMs, work instructions, quality procedures and supplier price
    lists from OneDrive/Outlook and from direct file uploads, with provenance recorded
    so answers stay grounded.
  block_ids:
  - onedrive
  - microsoft_365
  - capture
  - ingestion_provenance
  - pdf
  strategy_hint: REUSE
  required: true
  connectors:
  - outlook
- id: manager_dashboard
  description: A single manager dashboard showing cost and parts-price movements in
    MAD, recent document revisions, and open alerts across both plants.
  block_ids:
  - dashboard
  - analytics
  - aesthetic_kit
  strategy_hint: REUSE
  required: true
  connectors: []
- id: manager_only_access
  description: Simple manager-only log-in and roles, covering a handful to a few dozen
    managers across the two Moroccan plants.
  block_ids:
  - auth
  - user_auth
  - multi_tenant_rbac
  strategy_hint: REUSE
  required: true
  connectors: []
- id: sap_odata_connector
  description: Sap Odata Connector capability (reused from the block store)
  block_ids:
  - sap_odata_connector
  strategy_hint: REUSE
  required: true
  connectors: []
ui_modules:
- command_center
- operational_chat
- resident_engineer
connectors:
- sap_erp
- outlook
edge_profile: standard
serves_verticals: []
canonical_output: null
build_level: pilot
human_authority: true
factory_scenario: CREATE_PRODUCT
drafting_mode: architect_llm
drafting_note: 'inventory: ''product'' is not on the declared-ready list (construction,
  finance, finance_ops, hotel_management, insurance, retail); the Store kit for this
  vertical is unverified — domain depth not guaranteed'
golden_suggestion: null
delivery_format: zip
locale:
  country: MA
  currency: MAD
