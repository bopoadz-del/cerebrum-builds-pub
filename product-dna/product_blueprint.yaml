schema_version: product_blueprint.v1
product_id: product
product_name: Composting Products from Coffee in Tunisia
vertical: product
summary: 'A standalone prototype platform for a small Tunisian factory that turns
  coffee waste into composting products. It serves 5-10 internal staff across collection
  logistics, production, sales and finance. The system plans and tracks coffee-waste
  collections from cafés and other sources, follows compost batches through production,
  curing and quality checks, and manages the product catalog, price lists, customer
  orders and invoicing with Tunisian VAT (e.g. 19%) applied according to Tunisian
  rules. No '
capabilities:
- id: collection_planning_tracking
  description: 'Plan, schedule and track coffee-waste collections from cafés and other
    sources: log source details, pickup dates, quantities collected and status through
    to delivery at the factory.'
  block_ids:
  - task_listing
  - geolocation_tracking
  - workflow
  strategy_hint: REUSE
  required: true
  connectors: []
- id: batch_production_tracking
  description: 'Track compost batches through production stages, curing and quality
    checks: record batch inputs, process steps, curing durations, and quality test
    results with pass/fail status.'
  block_ids:
  - workflow
  - task_listing
  - audit
  strategy_hint: REUSE
  required: true
  connectors: []
- id: catalog_pricing_orders
  description: Manage the product catalog, price lists, customer records and customer
    orders, including order lines and totals.
  block_ids:
  - vendor_catalog
  - workflow
  strategy_hint: REUSE
  required: true
  connectors: []
- id: invoicing_tunisian_vat
  description: Generate invoices in Tunisian dinar (TND) with Tunisian VAT (e.g. 19%)
    applied according to Tunisian rules, including line items, VAT breakdown and totals,
    and track invoice status.
  block_ids:
  - billing
  - finance_canonical_model
  - finance_coa_governance
  strategy_hint: REUSE
  required: true
  connectors: []
- id: internal_staff_access
  description: Provide secure login and role-based access for the 5-10 internal staff
    covering collection/logistics, production floor, sales and finance.
  block_ids:
  - auth
  - multi_tenant_rbac
  strategy_hint: REUSE
  required: true
  connectors: []
- id: operational_dashboard
  description: Show an operational dashboard of collection status, batch progress,
    orders and invoices for internal staff.
  block_ids:
  - dashboard
  - analytics
  strategy_hint: REUSE
  required: true
  connectors: []
ui_modules:
- command_center
- operational_chat
- resident_engineer
connectors: []
edge_profile: standard
serves_verticals: []
canonical_output: null
build_level: prototype
human_authority: true
factory_scenario: CREATE_PRODUCT
drafting_mode: architect_llm
drafting_note: 'inventory: ''product'' is not on the declared-ready list (construction,
  finance, finance_ops, hotel_management, insurance, retail); the Store kit for this
  vertical is unverified — domain depth not guaranteed'
golden_suggestion: null
delivery_format: zip
locale:
  country: TN
  currency: TND
