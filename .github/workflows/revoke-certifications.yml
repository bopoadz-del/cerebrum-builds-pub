name: Revoke certifications

# Applies .github/store_gate/revoked_certifications.json: withdraws the
# store-gate commit status of every revoked run that is still its branch's
# newest gate verdict. The record is data; this workflow names no branch.
# Re-certify a revoked branch by dispatching the Store gate on it as usual:
# the newer run writes its own status and this workflow leaves it alone.

on:
  push:
    branches: [main]
    paths:
      - ".github/store_gate/revoked_certifications.json"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Withdraw revoked certifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/store_gate/revocations.py apply --repo "${{ github.repository }}"
