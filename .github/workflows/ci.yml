# Full suite — python -m pytest tests. Store-green measures this file.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      # Boot-clean: the platform imports with NO environment set. A
      # credential the operator supplies at deploy is never read at import.
      - name: import app.main with an empty environment
        run: env -i PATH="$PATH" HOME="$HOME" python -c "import app.main"
      - run: python -m pytest tests
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -r requirements.txt pip-audit bandit
      - run: pip-audit
      - run: bandit -ll -r app
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -r requirements.txt
      - run: python scripts/bench.py
