name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: pytest full suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-dev.txt ships with a generated PRODUCT, so every build/
      # branch has one -- but main is the scratch-store root and does not.
      # Demanding it unconditionally failed this job on main and on every PR
      # into main (including #26, which was merged red). pytest>=8.0 is
      # already in requirements.txt, so the suite runs either way.
      - run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - run: python -m pytest tests
