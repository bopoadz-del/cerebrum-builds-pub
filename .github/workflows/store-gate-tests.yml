# Unit tests for the Store gate's own helper scripts (.github/store_gate/).
# The gate itself is dispatch-only and judges products; this checks the gate.

name: Store gate scripts

on:
  pull_request:
    paths:
      - ".github/store_gate/**"
      - ".github/workflows/store-gate.yml"
      - ".github/workflows/image-mirror.yml"
      - ".github/workflows/store-gate-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: store-gate script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pytest pyyaml
      - run: python -m pytest -q .github/store_gate
